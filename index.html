<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2855ec" />
    <meta
      name="description"
      content="Проекты Ильи: цифровые инструменты, работа с ИИ и идеи в разработке."
    />
    <title>Илья — каталог проектов</title>
    <script>
      try {
        var t = localStorage.getItem("ilya-theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
